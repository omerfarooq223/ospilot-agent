      <stop offset="1" stop-color="#050808"/>
    </linearGradient>
    <linearGradient id="mint" x1="256" y1="208" x2="776" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8af7ee"/>

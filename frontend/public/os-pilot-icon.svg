<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OS Pilot icon</title>
  <desc id="desc">A local-first system pilot mark with a compass needle, protective ring, and clean storage base.</desc>
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="880" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1414"/>
